<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comisiones · LUTEC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #16283f; --navy-deep: #0f1d2e; --lime: #b8d726; --lime-dim: #97b31c;
    --paper: #f5f6f4; --card: #ffffff; --ink: #1a2433; --ink-soft: #5a6675;
    --line: #e3e7ec; --green: #2a9d5c; --amber: #d99a2b; --red: #c94a4a;
  }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
  .topbar { background: var(--navy); padding: 0 28px; display: flex; align-items: center; gap: 20px; height: 56px; border-bottom: 3px solid var(--lime); }
  .brand { color: #fff; font-weight: 700; letter-spacing: 3px; font-size: 18px; }
  .brand span { color: var(--lime); }
  .tab-label { color: rgba(255,255,255,0.6); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; margin-left: auto; }
  .header { padding: 32px 28px 20px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; }
  .header h1 { font-size: 30px; font-weight: 700; color: var(--navy); letter-spacing: -0.5px; }
  .header .sub { color: var(--ink-soft); font-size: 14px; margin-top: 4px; }
  .period { background: var(--navy); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .period .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
  .crumb { padding: 0 28px 16px; font-size: 13px; color: var(--ink-soft); display: none; }
  .crumb a { color: var(--lime-dim); cursor: pointer; text-decoration: none; font-weight: 600; }
  .crumb a:hover { text-decoration: underline; }
  .stats { padding: 0 28px 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .stat .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); }
  .stat .val { font-size: 24px; font-weight: 700; color: var(--navy); margin-top: 4px; }
  .stat.accent { background: var(--navy); }
  .stat.accent .lbl { color: rgba(255,255,255,0.6); }
  .stat.accent .val { color: var(--lime); }
  .sec-title { padding: 0 28px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-soft); font-weight: 700; }
  .buyers { padding: 0 28px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .buyer { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; position: relative; overflow: hidden; }
  .buyer:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(22,40,63,0.12); border-color: var(--navy); }
  .buyer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--lime); }
  .buyer-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color: var(--lime); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-transform: uppercase; }
  .buyer-name { font-size: 16px; font-weight: 700; color: var(--navy); text-transform: capitalize; }
  .buyer-role { font-size: 12px; color: var(--ink-soft); }
  .buyer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mini { background: var(--paper); border-radius: 8px; padding: 10px 12px; }
  .mini .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); }
  .mini .v { font-size: 17px; font-weight: 700; color: var(--navy); margin-top: 2px; }
  .mini.comis { background: var(--navy); }
  .mini.comis .l { color: rgba(255,255,255,0.55); }
  .mini.comis .v { color: var(--lime); }
  .buyer-foot { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-soft); }
  .go { color: var(--lime-dim); font-weight: 700; }
  .detail { display: none; padding: 0 28px 40px; }
  .detail.active { display: block; }
  .dashboard.hidden { display: none; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  thead th { background: var(--navy); color: #fff; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 10px; text-align: right; font-weight: 600; }
  thead th:first-child, thead th:nth-child(2) { text-align: left; }
  tbody td { padding: 11px 10px; text-align: right; font-size: 13px; border-bottom: 1px solid var(--line); }
  tbody td:first-child, tbody td:nth-child(2) { text-align: left; }
  tbody tr:hover { background: var(--paper); }
  tbody tr:last-child td { border-bottom: none; }
  .desc { font-weight: 600; color: var(--ink); }
  .terc { color: var(--ink-soft); font-size: 12px; }
  .badge { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
  .b-none { background: #f0e6e6; color: var(--red); }
  .b-low { background: #fbf1dd; color: var(--amber); }
  .b-mid { background: #e0f0e8; color: var(--green); }
  .b-high { background: var(--lime); color: var(--navy); }
  .comis-val { font-weight: 700; color: var(--navy); }
  tfoot td { background: var(--lime); color: var(--navy); font-weight: 700; padding: 14px 10px; text-align: right; font-size: 14px; }
  tfoot td:first-child { text-align: left; }
  .comis-table-wrap { margin-bottom: 24px; }
  .rules { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 28px; flex-wrap: wrap; }
  .rules h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); width: 100%; margin-bottom: 4px; }
  .rule { font-size: 13px; }
  .rule b { color: var(--navy); }
  .back-btn { background: none; border: 1px solid var(--line); color: var(--navy); padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
  .back-btn:hover { background: var(--navy); color: #fff; }
  .state { padding: 60px 28px; text-align: center; color: var(--ink-soft); }
  .state .spin { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--lime); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .refresh-btn { background: var(--lime); color: var(--navy); border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
  @media (max-width: 720px) { .stats { grid-template-columns: 1fr 1fr; } .header h1 { font-size: 24px; } table { font-size: 11px; } .hide-sm { display: none; } }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">LU<span>TEC</span></div>
    <div class="tab-label">Comisiones de compras</div>
  </div>
  <div class="header">
    <div>
      <h1 id="viewTitle">Comisiones del equipo</h1>
      <div class="sub" id="viewSub">Cargando datos desde Monday…</div>
    </div>
    <div class="period"><span class="dot"></span> Abril 2026</div>
  </div>
  <div class="crumb" id="crumb"><a onclick="showDashboard()">← Todos los compradores</a></div>
  <div class="dashboard" id="dashboard">
    <div id="loadingState" class="state"><div class="spin"></div>Consultando comisiones en vivo…</div>
    <div id="errorState" class="state" style="display:none;">
      No se pudieron cargar los datos.<br><br>
      <button class="refresh-btn" onclick="cargar()">Reintentar</button>
    </div>
    <div id="content" style="display:none;">
      <div class="stats" id="statStrip"></div>
      <div class="sec-title">Compradores</div>
      <div class="buyers" id="buyers"></div>
    </div>
  </div>
  <div class="detail" id="detail">
    <button class="back-btn" onclick="showDashboard()">← Volver al equipo</button>
    <div class="rules">
      <h3>Tabla de comisión por utilidad</h3>
      <div class="rule"><b>&lt; 10%</b> → 0%</div>
      <div class="rule"><b>10–20%</b> → 0.25%</div>
      <div class="rule"><b>20–30%</b> → 0.50%</div>
      <div class="rule"><b>≥ 30%</b> → 0.75%</div>
    </div>
    <div class="stats" id="detailStats"></div>
    <div class="comis-table-wrap"><table id="detailTable"></table></div>
  </div>

<script>
// ⬇️ AQUÍ va la URL de tu webhook de n8n
const API_URL = "https://licitaciones3.app.n8n.cloud/webhook/comisiones";

let DATA = [];

const fmt = n => '$' + Math.round(n).toLocaleString('es-CO');
const pct = n => n.toFixed(1) + '%';
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function commissionBadge(pctComis){
  if(pctComis===0) return '<span class="badge b-none">0%</span>';
  if(pctComis===0.25) return '<span class="badge b-low">0.25%</span>';
  if(pctComis===0.5) return '<span class="badge b-mid">0.50%</span>';
  return '<span class="badge b-high">0.75%</span>';
}

async function cargar(){
  document.getElementById('loadingState').style.display='block';
  document.getElementById('errorState').style.display='none';
  document.getElementById('content').style.display='none';
  try{
    const res = await fetch(API_URL);
    const json = await res.json();
    DATA = json.compradores || [];
    document.getElementById('loadingState').style.display='none';
    document.getElementById('content').style.display='block';
    document.getElementById('viewSub').textContent = 'Datos en vivo desde Monday · ' + DATA.length + ' compradores';
    renderDashboard();
  }catch(e){
    document.getElementById('loadingState').style.display='none';
    document.getElementById('errorState').style.display='block';
    document.getElementById('viewSub').textContent = 'Error de conexión';
  }
}

function renderDashboard(){
  const totComp = DATA.reduce((s,d)=>s+d.comprado,0);
  const totNeg = DATA.reduce((s,d)=>s+d.negociado,0);
  const totUtil = DATA.reduce((s,d)=>s+d.utilidad,0);
  const totComis = DATA.reduce((s,d)=>s+d.comision,0);
  document.getElementById('statStrip').innerHTML = `
    <div class="stat"><div class="lbl">Total comprado</div><div class="val">${fmt(totComp)}</div></div>
    <div class="stat"><div class="lbl">Total presupuesto</div><div class="val">${fmt(totNeg)}</div></div>
    <div class="stat"><div class="lbl">Utilidad generada</div><div class="val">${fmt(totUtil)}</div></div>
    <div class="stat accent"><div class="lbl">Comisiones a pagar</div><div class="val">${fmt(totComis)}</div></div>`;
  document.getElementById('buyers').innerHTML = DATA.map((d,i)=>`
    <div class="buyer" onclick="showDetail(${i})">
      <div class="buyer-head">
        <div class="avatar">${initials(d.nombre)}</div>
        <div><div class="buyer-name">${d.nombre}</div><div class="buyer-role">Comprador · ${d.lineas.length} materiales</div></div>
      </div>
      <div class="buyer-grid">
        <div class="mini"><div class="l">Comprado</div><div class="v">${fmt(d.comprado)}</div></div>
        <div class="mini"><div class="l">Utilidad</div><div class="v">${fmt(d.utilidad)}</div></div>
        <div class="mini comis" style="grid-column: span 2;"><div class="l">Comisión del mes</div><div class="v">${fmt(d.comision)}</div></div>
      </div>
      <div class="buyer-foot"><span>Ver detalle línea por línea</span><span class="go">Abrir →</span></div>
    </div>`).join('');
}

function showDetail(i){
  const d = DATA[i];
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('detail').classList.add('active');
  document.getElementById('crumb').style.display='block';
  document.getElementById('viewTitle').textContent = d.nombre;
  document.getElementById('viewTitle').style.textTransform = 'capitalize';
  document.getElementById('viewSub').textContent = `${d.lineas.length} materiales gestionados`;
  document.getElementById('detailStats').innerHTML = `
    <div class="stat"><div class="lbl">Comprado</div><div class="val">${fmt(d.comprado)}</div></div>
    <div class="stat"><div class="lbl">Presupuesto</div><div class="val">${fmt(d.negociado)}</div></div>
    <div class="stat"><div class="lbl">Utilidad</div><div class="val">${fmt(d.utilidad)}</div></div>
    <div class="stat accent"><div class="lbl">Comisión</div><div class="val">${fmt(d.comision)}</div></div>`;
  document.getElementById('detailTable').innerHTML = `
    <thead><tr><th>Material</th><th class="hide-sm">Proveedor</th><th>Cant</th><th>Bolsa</th><th>Compra</th><th>Utilidad</th><th>% Util</th><th>Comis</th><th>Valor</th></tr></thead>
    <tbody>${d.lineas.map(l=>`<tr>
      <td class="desc">${l.desc}</td><td class="terc hide-sm">${l.tercero||'—'}</td><td>${l.cant}</td>
      <td>${fmt(l.bolsa)}</td><td>${fmt(l.compra)}</td><td>${fmt(l.utilTotal)}</td><td>${pct(l.pctUtil)}</td>
      <td>${commissionBadge(l.pctComis)}</td><td class="comis-val">${l.valorComision>0?fmt(l.valorComision):'—'}</td>
    </tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="8">Total comisión · ${d.nombre}</td><td>${fmt(d.comision)}</td></tr></tfoot>`;
  window.scrollTo(0,0);
}

function showDashboard(){
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('detail').classList.remove('active');
  document.getElementById('crumb').style.display='none';
  document.getElementById('viewTitle').textContent='Comisiones del equipo';
  document.getElementById('viewTitle').style.textTransform='none';
  window.scrollTo(0,0);
}

cargar();
</script>
</body>
</html>
